name: Build RaTempEdit EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="RaTempEdit" --icon="ico_files/rtmp-text.ico" --add-data "icons_files;icons_files" --add-data "ico_files;ico_files" ratempedit.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RaTempEdit-Windows-EXE
        path: dist/RaTempEdit.exe
